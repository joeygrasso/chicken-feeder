replicaCount: 1
image:
  repository: nginx
  tag: 1.30.8
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 80
  annotations: {}
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: feed-my-chicken.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
